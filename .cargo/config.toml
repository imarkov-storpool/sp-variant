[build]
target = "x86_64-unknown-linux-musl"

[profile.release]
debug = true

[target.x86_64-unknown-linux-musl]
rustflags = ["-C", "target-feature=+crt-static"]

[source.crates-io]
replace-with = "vendored-sources"

[source.vendored-sources]
directory = "/opt/storpool/rust-crates-io/vendor"
